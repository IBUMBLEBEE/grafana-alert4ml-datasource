[workspace]
members = [
    "crates/*"
]
# rsod-ffi was removed in the Go→Rust migration (the plugin path has no
# cross-language boundary anymore). Keep the glob; exclude the deleted crate.
exclude = ["crates/rsod-ffi"]
resolver = "2"

# Vendored grafana-plugin-sdk 0.5.0 with a local frame-deserialization
# fix (see vendor/grafana-plugin-sdk/README.md). Replace with the crates.io
# release once upstream ships the fix.
[patch.crates-io]
grafana-plugin-sdk = { path = "vendor/grafana-plugin-sdk" }

[workspace.dependencies]
rsod-core = { path = "crates/rsod-core", version="0.1.2" }
rsod-outlier = { path = "crates/rsod-outlier", version="0.1.3" }
rsod-forecaster = { path = "crates/rsod-forecaster", version="0.1.3" }
rsod-baseline = { path = "crates/rsod-baseline", version="0.1.2" }
rsod-utils = { path = "crates/rsod-utils", version="0.1.3" }
rsod-storage = { path = "crates/rsod-storage", version="0.1.2" }
rsod-classifier = { path = "crates/rsod-classifier", version="0.1.2" }
rsod-funnel = { path = "crates/rsod-funnel", version="0.1.0" }

ndarray = "0.16.1"
rand = "0.8"
statrs = "0.18.0"
augurs = { version = "0.10.0", features = ["changepoint"] }
augurs-forecaster = "0.10.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
inventory = "0.3"
uuid = { version = "1", features = ["v4", "v5"] }
rayon = "1.8"
approx = "0.5.1"
extended-isolation-forest = { version = "0.2.3", features = ["serde"] }
bincode = "1.3"
csv = "1.3.1"
rustfft = "6"
num-complex = "0.4"
chrono = "0.4"
stlrs = "0.3.1"
itertools = "0.14.0"
polars = { version = "0.51.0", features = ["lazy"] }
arrow = { version = "56.2.0", features = ["ffi"] }
polars-arrow = "0.51.0"
perpetual = "2.1.0"
anofox-forecast = "0.7.2"

[profile.release]
panic = "abort"

[workspace.lints.rust]
missing_debug_implementations = "warn"
