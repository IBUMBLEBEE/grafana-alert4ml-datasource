[package]
name = "rsod-backend"
version = "0.1.0"
edition = "2021"
publish = false
description = "Alert4ML Grafana datasource backend plugin (Rust, replaces Go + FFI layer)"

[[bin]]
name = "gpx_alert4ml"
path = "src/main.rs"

[dependencies]
grafana-plugin-sdk = "0.5.0"
futures-util = "0.3"
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
tracing = "0.1"
thiserror = "2"
chrono.workspace = true
uuid = { version = "1", features = ["v4", "v5"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
postgres = "0.19"

rsod-core.workspace = true
rsod-outlier.workspace = true
rsod-baseline.workspace = true
rsod-funnel.workspace = true
rsod-forecaster.workspace = true
rsod-storage.workspace = true

[lints]
workspace = true
