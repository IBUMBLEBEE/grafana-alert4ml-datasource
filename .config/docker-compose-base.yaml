services:
  grafana:
    user: root
    container_name: 'ibumblebee-alert4ml-datasource'

    build:
      context: .
      args:
        grafana_image: ${GRAFANA_IMAGE:-grafana-enterprise}
        grafana_version: ${GRAFANA_VERSION:-11.5.3-ubuntu}
        development: ${DEVELOPMENT:-false}
        anonymous_auth_enabled: ${ANONYMOUS_AUTH_ENABLED:-true}
    ports:
      - 3003:3000/tcp
      - 2345:2345/tcp # delve
    security_opt:
      - 'apparmor:unconfined'
      - 'seccomp:unconfined'
    cap_add:
      - SYS_PTRACE
    volumes:
      - ../dist:/var/lib/grafana/plugins/ibumblebee-alert4ml-datasource
      - ../provisioning:/etc/grafana/provisioning
      - ..:/root/ibumblebee-alert4ml-datasource
      - ./data/grafana:/var/lib/grafana
    environment:
      NODE_ENV: development
      GF_LOG_FILTERS: plugin.ibumblebee-alert4ml-datasource:debug
      GF_LOG_LEVEL: error
      GF_DATAPROXY_LOGGING: 1
      GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS: ibumblebee-alert4ml-datasource
      # plugin-e2e auth uses POST /login; requires basic auth enabled
      GF_AUTH_BASIC_ENABLED: 'true'
      # Keep Grafana and @grafana/plugin-e2e on the same credential source.
      # Existing Grafana databases still require a one-time CLI reset when
      # their persisted admin password differs from these values.
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
