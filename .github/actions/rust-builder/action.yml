name: 'Rust Plugin Backend Builder'
description: 'Compiles the Rust plugin backend (rsod-backend) for a musl target using cargo-zigbuild and copies the binary into dist/'

inputs:
  target:
    description: 'Rust compilation target (musl)'
    default: 'x86_64-unknown-linux-musl'
    required: true

runs:
  using: "composite"
  steps:
    - name: Set up Rust
      uses: dtolnay/rust-toolchain@nightly
      with:
        toolchain: nightly-2025-12-05
        targets: ${{ inputs.target }}

    - name: Add Rust musl target
      shell: bash
      run: rustup target add ${{ inputs.target }} --toolchain nightly-2025-12-05

    - name: Install zig
      shell: bash
      run: |
        ZIG_VERSION=0.15.2
        curl -fsSL https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz \
          | tar xJ -C /tmp
        sudo mv /tmp/zig-x86_64-linux-${ZIG_VERSION} /opt/zig
        sudo ln -sf /opt/zig/zig /usr/local/bin/zig
        zig version

    - name: Install cargo-zigbuild
      shell: bash
      run: cargo install cargo-zigbuild --locked

    - name: Build plugin backend
      shell: bash
      run: |
        echo "Building rsod-backend for target: ${{ inputs.target }}"
        cd rsod/
        cargo zigbuild --release --target ${{ inputs.target }} -p rsod-backend

    # Grafana resolves the plugin.json `executable` plus a GOOS/GOARCH-style
    # suffix, so the binary must be named gpx_alert4ml_linux_<arch> in dist/.
    - name: Copy plugin binary to dist/
      shell: bash
      run: |
        case "${{ inputs.target }}" in
          x86_64-unknown-linux-musl)  os_arch=linux_amd64 ;;
          aarch64-unknown-linux-musl) os_arch=linux_arm64 ;;
          *) echo "Unsupported target: ${{ inputs.target }}"; exit 1 ;;
        esac
        mkdir -p dist
        cp rsod/target/${{ inputs.target }}/release/gpx_alert4ml dist/gpx_alert4ml_${os_arch}
        echo "=== Plugin binary ==="
        ls -lh dist/gpx_alert4ml_${os_arch}
